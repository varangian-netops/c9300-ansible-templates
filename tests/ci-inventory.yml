# CI-only inventory for --syntax-check. No device is ever contacted in CI.
all:
  children:
    c9300_switches:
      hosts:
        ci-sw1: { ansible_host: 192.0.2.11 }
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.ios
        access_ports: [GigabitEthernet1/0/1, GigabitEthernet1/0/2]
        uplink_ports: [TenGigabitEthernet1/1/1, TenGigabitEthernet1/1/2]
